[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtb"
version = "0.2.0"
description = "DTB — Digital Twin of Business: activity-based enterprise digital twin platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
dtb = "dtb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# контур верификации длинный: по умолчанию он не мешает быстрым тестам,
# запускается явно (`pytest -m verification` либо `pytest tests/verification`)
addopts = "-q -m 'not verification'"
markers = [
    "verification: сверка расчёта с аналитическими эталонами (длинные прогоны)",
]
